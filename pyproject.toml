[project]
name = "commonplace"
version = "0.1.0"
description = "Map the records an AI-native company produces into a local Obsidian vault."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
keychain = ["keyring>=25"]

[project.scripts]
commonplace = "commonplace.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commonplace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
